<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Journal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ENCABEZADO -->

    <header class="encabezado">

        <h1>BOOK JOURNAL</h1>

        <p>Mi diario de lectura</p>

    </header>


    <!-- CONTENEDOR PRINCIPAL -->

    <div class="app">


        <!-- MENU -->

        <aside class="menu">

            <button
                onclick="mostrarPagina('inicio')"
                class="boton-menu"
            >
                🏠
                <span>Inicio</span>
            </button>


            <button
    onclick="mostrarLibros()"
    class="boton-menu"
>
    📚
    <span>Librería</span>
</button>


            <button
                onclick="mostrarPagina('estanterias')"
                class="boton-menu"
            >
                📖
                <span>Estanterías</span>
            </button>


            <button
                onclick="mostrarPagina('resenas')"
                class="boton-menu"
            >
                ⭐
                <span>Reseñas</span>
            </button>


            <button
                onclick="mostrarPagina('favorito')"
                class="boton-menu"
            >
                💚
                <span>Favorito</span>
            </button>


            <button
                onclick="mostrarPagina('tracker')"
                class="boton-menu"
            >
                📅
                <span>Tracker</span>
            </button>


            <button
                onclick="mostrarPagina('citas')"
                class="boton-menu"
            >
                💬
                <span>Citas</span>
            </button>


            <button
                onclick="mostrarPagina('autores')"
                class="boton-menu"
            >
                👩
                <span>Autores</span>
            </button>


            <button
                onclick="mostrarRegistro()"
                class="boton-menu"
            >
                📝
                <span>Registro</span>
            </button>


            <button
                onclick="mostrarPagina('adaptaciones')"
                class="boton-menu"
            >
                🎬
                <span>Adaptaciones</span>
            </button>


            <button
                onclick="mostrarPagina('recap')"
                class="boton-menu"
            >
                📊
                <span>Recap</span>
            </button>

        </aside>


        <!-- CONTENIDO -->

        <main
            id="contenido"
            class="contenido"
        >

            <h2>Bienvenida 📚</h2>

            <p>
                Selecciona una sección
                para comenzar.
            </p>

        </main>


    </div>


    <script src="script.js"></script>

</body>

</html>
