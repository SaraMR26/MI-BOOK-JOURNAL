<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Journal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header class="header">

        <h1>BOOK JOURNAL</h1>

        <p>Mi diario de lectura</p>

    </header>


    <nav class="menu">

        <button onclick="mostrarPagina('inicio')">
            🏠 Inicio
        </button>

        <button onclick="mostrarPagina('libreria')">
            📚 Librería
        </button>

        <button onclick="mostrarPagina('estanterias')">
            📖 Estanterías
        </button>

        <button onclick="mostrarPagina('resenas')">
            ⭐ Reseñas
        </button>

        <button onclick="mostrarPagina('favorito')">
            💚 Favorito del mes
        </button>

        <button onclick="mostrarPagina('tracker')">
            📅 Reading Tracker
        </button>

        <button onclick="mostrarPagina('citas')">
            💬 Citas
        </button>

        <button onclick="mostrarPagina('autores')">
            👩 Autores
        </button>

        <button onclick="mostrarPagina('registro')">
            📝 Registro
        </button>

        <button onclick="mostrarPagina('adaptaciones')">
            🎬 Adaptaciones
        </button>

        <button onclick="mostrarPagina('recap')">
            📊 Recap
        </button>

    </nav>


    <main id="contenido">

        <h2>Bienvenida a mi Book Journal 📚</h2>

        <p>
            Selecciona una sección para comenzar.
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
