<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <h1>BOOK JOURNAL</h1>
        <p>Mi diario de lectura</p>
    </header>

    <!-- CONTENEDOR PRINCIPAL TIPO CUADERNO -->
    <div class="journal-wrapper">

        <!-- MENU LATERAL IZQUIERDO -->
        <aside class="tabs-side tabs-left">
            <button onclick="mostrarPagina('inicio')" class="tab-btn active" data-tab="inicio" style="--tab-bg: #D8B4F8;">🏠 <span>Inicio</span></button>
            <button onclick="mostrarPagina('libreria')" class="tab-btn" data-tab="libreria" style="--tab-bg: #E2F0CB;">📚 <span>Librería</span></button>
            <button onclick="mostrarPagina('estanterias')" class="tab-btn" data-tab="estanterias" style="--tab-bg: #FFD1DC;">📖 <span>Estanterías</span></button>
            <button onclick="mostrarPagina('resenas')" class="tab-btn" data-tab="resenas" style="--tab-bg: #FFDAC1;">⭐ <span>Reseñas</span></button>
            <button onclick="mostrarPagina('favorito')" class="tab-btn" data-tab="favorito" style="--tab-bg: #FFB7B2;">💚 <span>Favorito</span></button>
            <button onclick="mostrarPagina('tracker')" class="tab-btn" data-tab="tracker" style="--tab-bg: #FFFFBA;">📅 <span>Tracker</span></button>
        </aside>

        <!-- CONTENIDO CENTRAL DE LAS PÁGINAS -->
        <main id="contenido" class="journal-body">
            <h2>🏠 Bienvenida</h2>
            <p>Bienvenida a tu Book Journal. Selecciona una sección para comenzar.</p>
        </main>

        <!-- MENU LATERAL DERECHO -->
        <aside class="tabs-side tabs-right">
            <button onclick="mostrarPagina('citas')" class="tab-btn" data-tab="citas" style="--tab-bg: #E0FEFE;">💬 <span>Citas</span></button>
            <button onclick="mostrarPagina('autores')" class="tab-btn" data-tab="autores" style="--tab-bg: #BAFFC9;">👩 <span>Autores</span></button>
            <button onclick="mostrarPagina('registro')" class="tab-btn" data-tab="registro" style="--tab-bg: #D6C7FF;">📝 <span>Registro</span></button>
            <button onclick="mostrarPagina('adaptaciones')" class="tab-btn" data-tab="adaptaciones" style="--tab-bg: #BAE1FF;">🎬 <span>Adaptaciones</span></button>
            <button onclick="mostrarPagina('recap')" class="tab-btn" data-tab="recap" style="--tab-bg: #FFDFBA;">📊 <span>Recap</span></button>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
